[package]
name = "octo-com"
version = "1.0.0"
edition = "2021"
authors = ["Leonid Medovyy <leonid@macron1.io>"]
description = "A fast CLI and keyboard-driven TUI for managing Octopus $$ command definitions"
readme = "README.md"
repository = "https://github.com/octopus-harness/octo-com"
license = "MIT"
keywords = ["octopus", "cli", "tui", "ratatui", "commands"]
categories = ["command-line-utilities"]

[lib]
name = "octo_com"
path = "src/lib.rs"

[[bin]]
name = "com"
path = "src/main.rs"

[[bin]]
name = "octo-com"
path = "src/bin/octo-com.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1"
unicode-width = "0.1"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
